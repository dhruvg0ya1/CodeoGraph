[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeograph"
version = "2.0.0"
description = "Grounded answers, change impact and PR review over any codebase: Tree-sitter chunks, hybrid search, a dependency graph, a LangGraph agent and an MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dhruv Goyal" }]
keywords = ["rag", "code-search", "langgraph", "mcp", "tree-sitter", "llm", "agents"]
dependencies = [
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "rank-bm25>=0.2.2",
  "networkx>=3.2",
  "numpy>=1.26",
  "fastembed>=0.5",
  "gitpython>=3.1",
  "python-dotenv>=1.0",
  "pydantic>=2.6",
  "langgraph>=0.4",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "mcp>=2.3,<3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
gemini = ["langchain-google-genai>=2.0"]
qdrant = ["qdrant-client>=1.12"]
ui = ["streamlit>=1.38", "requests>=2.31"]
evals = ["ragas>=0.2", "datasets>=2.20"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
codeograph = "codeograph.cli:main"

[project.urls]
Repository = "https://github.com/dhruvg0ya1/CodeoGraph"

[tool.hatch.build.targets.wheel]
packages = ["codeograph"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
