name: evals
on:
  push:
    branches: [main]
    paths: ["codeograph/**", "evals/**", ".github/workflows/evals.yml"]
  schedule:
    - cron: "0 3 * * 1"          # weekly, Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      models:
        description: "Embedders to compare (comma separated)"
        default: "BAAI/bge-small-en-v1.5"
      answers:
        description: "Also run the answer eval (LLM via GitHub Models)"
        type: boolean
        default: true

permissions:
  contents: write
  models: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CODEOGRAPH_HOME: ${{ github.workspace }}/.codeograph
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 && uv pip install -e ".[evals]"
      - uses: actions/cache@v4
        with:
          path: .codeograph/models
          key: fastembed-${{ inputs.models || 'BAAI/bge-small-en-v1.5' }}-v1
      - name: Retrieval eval (gate - Recall@5 of the default pipeline)
        run: .venv/bin/python evals/retrieval_eval.py --models "${{ inputs.models || 'BAAI/bge-small-en-v1.5' }}" --write-readme --min-recall5 0.6
      - name: Answer eval (LangGraph agent + RAGAS, GitHub Models)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.answers }}
        env:
          CODEOGRAPH_LLM: github
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .venv/bin/python evals/answer_eval.py --n 12 --write-readme
      - name: Commit refreshed results
        run: |
          git config user.name "codeograph-evals"
          git config user.email "codeograph-evals@users.noreply.github.com"
          git add README.md evals/results
          git diff --cached --quiet || git commit -m "evals: refresh results [skip ci]"
          git pull --rebase -q && git push -q
