name: evals
on:
  push:
    branches: [main]
    paths: ["codeograph/**", "evals/**", ".github/workflows/evals.yml"]
  schedule:
    - cron: "0 3 * * 1"          # weekly, Monday 03:00 UTC: retrieval + answers
  workflow_dispatch:
    inputs:
      models:
        description: "Embedders to compare (comma separated)"
        default: "BAAI/bge-small-en-v1.5"
      answers:
        description: "Also run the answer eval (LangGraph agent + RAGAS)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CODEOGRAPH_HOME: ${{ github.workspace }}/.codeograph
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 && uv pip install -e .
      - uses: actions/cache@v4
        with:
          path: .codeograph/models
          key: fastembed-v3-${{ github.run_id }}
          restore-keys: fastembed-v3-
      - name: Retrieval eval (gate - Recall@5 of the default pipeline)
        run: .venv/bin/python evals/retrieval_eval.py --models "${{ inputs.models || 'BAAI/bge-small-en-v1.5' }}" --write-readme --min-recall5 0.85
      - name: Commit refreshed results
        run: |
          git config user.name "codeograph-evals"
          git config user.email "codeograph-evals@users.noreply.github.com"
          mkdir -p /tmp/new && cp evals/results/retrieval.json evals/results/retrieval.md /tmp/new/
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/new/* evals/results/ && .venv/bin/python evals/update_readme.py
            git add README.md evals/results
            git diff --cached --quiet && exit 0
            git commit -q -m "evals: retrieval results [skip ci]" && git push -q && exit 0
          done
          exit 1

  answers:
    needs: retrieval
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.answers) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CODEOGRAPH_HOME: ${{ github.workspace }}/.codeograph
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 && uv pip install -e ".[evals,gemini]"
      - uses: actions/cache@v4
        with:
          path: .codeograph/models
          key: fastembed-v3-answers-${{ github.run_id }}
          restore-keys: fastembed-v3-
      - name: Answer eval (agent answers + citations; RAGAS on the first 5) - Gemini's free model chain, else Qwen2.5 3B
        # Gemini (when the repo has a GOOGLE_API_KEY secret) runs first through its chain of free models; if every
        # free quota is gone it falls back to an open model on the runner's CPU via Ollama, so the eval never fails
        # on an outside quota.
        run: |
          eval_run() { env "$@" .venv/bin/python evals/answer_eval.py --n 10 --ragas-n 5 --write-readme; }
          if [ -n "$GOOGLE_API_KEY" ] && eval_run CODEOGRAPH_LLM=gemini; then exit 0; fi
          [ -n "$GOOGLE_API_KEY" ] && echo "::notice::Gemini's free quota is used up - answering with Qwen2.5 3B"
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          curl -s --retry 40 --retry-all-errors --retry-delay 1 http://localhost:11434/api/version
          ollama pull qwen2.5:3b
          eval_run CODEOGRAPH_LLM=openai OPENAI_BASE_URL=http://localhost:11434/v1 OPENAI_MODEL=qwen2.5:3b \
            OPENAI_API_KEY=ollama
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: answer-eval
          path: evals/results
      - name: Commit refreshed results
        run: |
          git config user.name "codeograph-evals"
          git config user.email "codeograph-evals@users.noreply.github.com"
          mkdir -p /tmp/new && cp evals/results/answers.json evals/results/answers.md /tmp/new/
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/new/* evals/results/ && .venv/bin/python evals/update_readme.py
            git add README.md evals/results
            git diff --cached --quiet && exit 0
            git commit -q -m "evals: answer results [skip ci]" && git push -q && exit 0
          done
          exit 1
